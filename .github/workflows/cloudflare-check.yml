name: Cloudflare Worker Check

on:
  push:
    branches:
      - cloudflare-multiplayer
  pull_request:
    branches:
      - cloudflare-multiplayer

jobs:
  validate-worker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Cloudflare Worker
        run: npx --yes wrangler@latest deploy --dry-run
